<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ff9f1c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<title>英语预习小助手</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(165deg, #dff3ff 0%, #fff7e6 55%, #ffeef2 100%);
    min-height: 100vh; color: #333; font-size: 17px;
  }
  button { font-family: inherit; }
  #app { max-width: 540px; margin: 0 auto; padding: 14px 16px calc(46px + env(safe-area-inset-bottom)); }

  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .title { font-size: 21px; font-weight: 800; flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .back { width: 44px; height: 44px; border: none; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.1); font-size: 18px; cursor: pointer; flex: none; }
  .back:active { transform: scale(.94); }
  .streak { font-size: 13px; font-weight: 700; color: #e8590c; background: #fff; border-radius: 999px; padding: 7px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); white-space: nowrap; }
  .stars { font-size: 13px; color: #bbb; font-weight: 600; white-space: nowrap; }
  .stars.sm { color: #f5a623; }

  .card { background: #fff; border-radius: 22px; box-shadow: 0 6px 18px rgba(0,0,0,.08); padding: 20px; margin-bottom: 12px; }

  .stagetabs { display: flex; gap: 8px; margin: 4px 0 12px; }
  .stab { flex: 1; padding: 11px 0; border: none; border-radius: 14px; background: #fff; font-size: 15px; font-weight: 800; color: #888; box-shadow: 0 2px 6px rgba(0,0,0,.06); cursor: pointer; }
  .stab.active { background: linear-gradient(135deg, #6a5cff, #a78bfa); color: #fff; box-shadow: 0 4px 12px rgba(106,92,255,.35); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .book { border: none; border-radius: 20px; padding: 22px 8px; font-size: 18px; font-weight: 800; color: #fff; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
  .book:active { transform: scale(.96); }
  .book:nth-of-type(1) { background: linear-gradient(135deg, #2ec4b6, #1fa0c9); }
  .book:nth-of-type(2) { background: linear-gradient(135deg, #4dabf7, #3b8be8); }
  .book:nth-of-type(3) { background: linear-gradient(135deg, #ff9f1c, #f76707); }
  .book:nth-of-type(4) { background: linear-gradient(135deg, #845ef7, #7048e8); }
  .book:nth-of-type(5) { background: linear-gradient(135deg, #51cf66, #37b24d); }
  .book:nth-of-type(6) { background: linear-gradient(135deg, #ff6b6b, #f03e3e); }
  .book:nth-of-type(7) { background: linear-gradient(135deg, #22b8cf, #15aabf); }
  .book:nth-of-type(8) { background: linear-gradient(135deg, #f06595, #d6336c); }
  .book .bsub { font-size: 12px; font-weight: 600; opacity: .9; margin-top: 6px; }
  .book.lock { background: #e9ecef !important; color: #adb5bd; box-shadow: none; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .unit { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #fff; border: none; border-radius: 16px; padding: 16px 18px; font-size: 17px; font-weight: 700; box-shadow: 0 3px 10px rgba(0,0,0,.07); cursor: pointer; text-align: left; }
  .unit:active { transform: scale(.98); }

  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab { flex: 1; border: none; border-radius: 999px; padding: 12px; font-size: 17px; font-weight: 700; background: #fff; color: #999; box-shadow: 0 2px 8px rgba(0,0,0,.07); cursor: pointer; }
  .tab.on { background: #ff9f1c; color: #fff; }
  .tab:disabled { opacity: .4; }

  .wordcard { text-align: center; padding: 26px 18px; cursor: pointer; }
  .emoji { font-size: 84px; line-height: 1.15; }
  .wen { font-size: 38px; font-weight: 800; margin-top: 6px; word-break: break-word; }
  .wzh { font-size: 20px; color: #666; margin-top: 6px; }
  .wex { margin-top: 10px; }
  .counter { color: #bbb; margin-top: 12px; font-size: 13px; font-weight: 600; }

  .row { display: flex; gap: 10px; align-items: center; justify-content: center; margin: 12px 0; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .btn { border: none; border-radius: 999px; background: #ff9f1c; color: #fff; font-size: 18px; font-weight: 800; padding: 14px 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(255,159,28,.4); }
  .btn:active { transform: scale(.96); }
  .btn.alt { background: #2ec4b6; box-shadow: 0 4px 10px rgba(46,196,182,.4); }
  .btn.ghost { background: #fff; color: #ff9f1c; box-shadow: 0 3px 8px rgba(0,0,0,.1); }
  .btn.big { width: 100%; padding: 16px; font-size: 19px; }
  .btn.small { font-size: 14px; padding: 9px 14px; }
  .btn.wrongbtn { width: 100%; background: #e8590c; box-shadow: 0 4px 10px rgba(232,89,12,.35); margin-bottom: 14px; }
  .round { width: 52px; height: 52px; border: none; border-radius: 50%; background: #fff; font-size: 19px; box-shadow: 0 3px 8px rgba(0,0,0,.1); cursor: pointer; }
  .round:active { transform: scale(.94); }
  .round:disabled { opacity: .35; }
  .mini { border: none; background: #fff5db; border-radius: 999px; padding: 8px 14px; font-size: 15px; cursor: pointer; color: #8a6d3b; font-weight: 600; }

  .slist { display: flex; flex-direction: column; gap: 10px; }
  .sent { display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; }
  .sent .sen { flex: 1; font-size: 19px; font-weight: 600; word-break: break-word; }
  .sent .szh { display: block; font-size: 14px; color: #999; font-weight: 400; margin-top: 3px; }
  .sent.cur { outline: 4px solid #ffd43b; }
  .sent .mini { flex: none; }

  .qcard { text-align: center; padding: 28px 18px; }
  .qword { font-size: 40px; font-weight: 800; word-break: break-word; }
  .qemoji { font-size: 96px; line-height: 1.2; }
  .bigsound { width: 110px; height: 110px; margin: 0 auto; border: none; border-radius: 50%; background: #2ec4b6; color: #fff; font-size: 46px; cursor: pointer; box-shadow: 0 6px 16px rgba(46,196,182,.45); }
  .bigsound:active { transform: scale(.94); }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .opt { border: none; border-radius: 16px; background: #f1f3f5; padding: 18px 8px; font-size: 19px; font-weight: 700; cursor: pointer; min-height: 64px; word-break: break-word; }
  .opt:active { transform: scale(.97); }
  .opt.right { background: #8ce99a; }
  .opt.wrong { background: #ffa8a8; }

  .result { text-align: center; padding: 30px 20px; }
  .remoji { font-size: 76px; }
  .rscore { font-size: 44px; font-weight: 800; margin: 8px 0 4px; }
  .rstars { font-size: 32px; }
  .wlist { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }

  .empty { text-align: center; color: #999; line-height: 1.9; }
  .warn { background: #fff3bf; color: #d9480f; padding: 10px 14px; border-radius: 12px; font-size: 14px; margin-bottom: 12px; font-weight: 600; }
  .tip { font-size: 13px; color: #b0b0b0; text-align: center; line-height: 1.7; margin-top: 14px; }

  /* ---------------- 新增功能 ---------------- */
  .section-title { font-size: 16px; font-weight: 800; color: #555; margin: 18px 0 10px; }
  .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .tool { border: none; border-radius: 18px; background: #fff; padding: 14px 6px; font-size: 14px; font-weight: 700; color: #555; box-shadow: 0 3px 10px rgba(0,0,0,.08); cursor: pointer; text-align: center; }
  .tool:active { transform: scale(.96); }
  .tool .ticon { font-size: 28px; display: block; margin-bottom: 4px; }
  .tool.primary { color: #ff9f1c; }
  .tool.alt { color: #2ec4b6; }
  .tool.danger { color: #e8590c; }

  .hwcard { display: flex; align-items: center; gap: 12px; padding: 16px 18px; cursor: pointer; }
  .hwcard .hwinfo { flex: 1; }
  .hwcard .hwtit { font-weight: 800; font-size: 16px; }
  .hwcard .hwsub { font-size: 13px; color: #888; margin-top: 2px; }
  .hwcard .hwprog { font-size: 13px; font-weight: 700; color: #2ec4b6; min-width: 48px; text-align: right; }
  .hwcard.done { opacity: .7; }
  .hwcheck { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #ddd; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; flex: none; }
  .hwcard.done .hwcheck { background: #2ec4b6; border-color: #2ec4b6; }
  .hwempty { text-align: center; color: #999; padding: 22px; }

  .hwlist2 { display: flex; flex-direction: column; gap: 8px; }
  .hitem { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 14px; padding: 12px 14px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .hitem .hnum { width: 26px; height: 26px; border-radius: 50%; background: #b9c3cc; color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
  .hitem.done .hnum { background: #2ec4b6; }
  .hitem .htxt { flex: 1; font-size: 15px; font-weight: 700; }
  .hitem .hbtn { flex: none; border: none; border-radius: 999px; background: #ff9f1c; color: #fff; font-size: 13px; font-weight: 700; padding: 7px 14px; cursor: pointer; }
  .hitem.done .htxt { text-decoration: line-through; color: #aaa; }
  .hitem.done .hbtn { background: #2ec4b6; }

  /* 作业本：按册/单元嵌套分组 */
  .hwgrp { border-radius: 14px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.06); overflow: hidden; margin-bottom: 10px; }
  .hwgrp.all-done { opacity: .75; }
  .hwgrp-hd { display: flex; align-items: center; gap: 10px; padding: 13px 14px; cursor: pointer; user-select: none; }
  .hwgrp-hd .hwarr { width: 20px; font-size: 15px; color: #999; text-align: center; flex: none; }
  .hwgrp-hd .hg-txt { flex: 1; min-width: 0; }
  .hwgrp-hd .hg-name { font-size: 15px; font-weight: 800; color: #555; }
  .hwgrp-hd .hg-unit { font-size: 12px; color: #999; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hwgrp-hd .hg-prog { flex: none; font-size: 13px; font-weight: 700; color: #2ec4b6; background: #e6fbf8; border-radius: 999px; padding: 3px 10px; }
  .hwgrp-bd { display: flex; flex-direction: column; gap: 8px; padding: 0 12px 12px; }
  .hwgrp-bd .hitem { box-shadow: none; border: 1px solid #f0f2f4; }
  .hwgrp-bd .htxt { display: flex; align-items: center; }
  .hwtag { display: inline-block; background: #f1f3f5; color: #666; font-size: 12px; font-weight: 700; border-radius: 8px; padding: 3px 9px; }

  .statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat { background: #fff; border-radius: 16px; padding: 14px; text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,.06); }
  .stat .snum { font-size: 28px; font-weight: 800; color: #ff9f1c; }
  .stat .slab { font-size: 13px; color: #888; margin-top: 2px; }
  .progress { background: #f1f3f5; border-radius: 999px; height: 10px; overflow: hidden; }
  .progress .bar { height: 100%; background: #2ec4b6; width: 0; border-radius: 999px; transition: width .4s ease; }
  .reportrow { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; font-size: 14px; }
  .weekbar { display: flex; align-items: flex-end; gap: 4px; height: 60px; justify-content: center; }
  .weekday { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .weekday .wcol { width: 24px; background: #ffecd2; border-radius: 4px; }
  .weekday .wday { font-size: 11px; color: #999; }

  .darea { text-align: center; }
  .dzh { font-size: 22px; color: #555; margin-bottom: 8px; }
  .den { font-size: 28px; font-weight: 800; margin: 4px 0; }
  .dinput { width: 100%; font-size: 22px; padding: 12px 16px; border: 2px solid #ddd; border-radius: 14px; outline: none; text-align: center; }
  .dinput:focus { border-color: #ff9f1c; }
  .dresult { margin-top: 10px; font-size: 18px; font-weight: 700; min-height: 28px; }
  .dresult.ok { color: #2ec4b6; }
  .dresult.bad { color: #e8590c; }

  .tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .tile { width: 44px; height: 44px; border: none; border-radius: 10px; background: #ff9f1c; color: #fff; font-size: 22px; font-weight: 800; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,.15); }
  .tile:disabled { opacity: .45; transform: none; }
  .tile:active { transform: scale(.92); }
  .slots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 46px; margin-bottom: 8px; }
  .slot { width: 40px; height: 44px; border: 2px dashed #ccc; border-radius: 10px; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; color: #333; background: #fff; }
  .slot.filled { border-style: solid; border-color: #ff9f1c; }

  .twrap { background: #fff; border-radius: 18px; padding: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.08); text-align: center; }
  .tcanvas { width: 100%; height: 300px; border-radius: 12px; background: #fffdf5; touch-action: none; cursor: crosshair; }
  .tguide { font-size: 120px; font-weight: 800; color: rgba(0,0,0,.08); position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; }
  .tpos { position: relative; display: inline-block; width: 100%; }
  .target-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; }
  .target { font-size: 24px; font-weight: 800; color: #ff9f1c; background: #fff5db; padding: 8px 18px; border-radius: 999px; }

  .selmode { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #666; }
  .ucheck { width: 20px; height: 20px; border: 2px solid #ff9f1c; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; flex: none; }
  .unit.sel .ucheck { background: #ff9f1c; }
  .actbar { display: flex; gap: 10px; margin-bottom: 14px; }
  .actbar .btn { flex: 1; }

  .checkbox { display: inline-flex; align-items: center; gap: 6px; background: #fff; border-radius: 999px; padding: 8px 12px; font-size: 14px; font-weight: 700; color: #666; box-shadow: 0 2px 6px rgba(0,0,0,.08); cursor: pointer; }

  /* 填空练习（Cloze） */
  .cloze { font-size: 19px; line-height: 2; font-weight: 600; word-break: break-word; margin-bottom: 6px; }
  .cloze .hole { display: inline-flex; min-width: 58px; padding: 0 8px; height: 34px; border-radius: 8px 8px 0 0; border-bottom: 3px solid #ff9f1c; background: #fff5db; color: #ff9f1c; font-weight: 800; align-items: center; justify-content: center; cursor: pointer; vertical-align: middle; margin: 0 2px; }
  .cloze .hole.empty { background: #f1f3f5; color: #bbb; border-color: #ddd; }
  .cloze .hole.ok { background: #d3f9d8; color: #2b8a3e; border-color: #40c057; }
  .cloze .hole.bad { background: #ffe3e3; color: #c92a2a; border-color: #fa5252; }

  /* 复习反馈闭环 */
  .tool { position: relative; }
  .tool .badge { position: absolute; top: 6px; right: 8px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #e8590c; color: #fff; font-size: 11px; line-height: 18px; font-weight: 800; }
  .ratesec { margin-top: 18px; border-top: 1px dashed #eee; padding-top: 14px; }
  .ratetit { font-size: 14px; font-weight: 700; color: #e8590c; margin-bottom: 10px; }
  .rateitem { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 0; border-bottom: 1px solid #f3f3f3; }
  .rateitem:last-child { border-bottom: none; }
  .rateitem .ren { font-size: 17px; font-weight: 800; color: #333; flex: 1 1 100%; }
  .rateitem .rzh { font-size: 13px; color: #999; flex: 1 1 100%; margin-top: -4px; }
  .ratebtns { display: flex; gap: 8px; flex: 1 1 100%; }
  .ratebtns button { flex: 1; border: 2px solid #ffe0c2; background: #fff7ef; color: #c8761b; border-radius: 12px; padding: 9px 4px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .ratebtns button:active { transform: scale(.96); }
  .ratebtns button.on { background: #ff9f1c; color: #fff; border-color: #ff9f1c; }
  .ratebtns.big button { padding: 14px 4px; font-size: 15px; }
</style>
</head>
<body>
<div id="app">加载中…</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
